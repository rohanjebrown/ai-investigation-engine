[project]
name = "ai-investigation-engine"
version = "0.1.0"
description = "An AI-powered investigation engine for multi-document reasoning"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "huggingface-hub>=2.3.0",
    "psycopg[binary]>=3.2.10,<4",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "tokenizers==0.23.3",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investigation_engine"
source-include = [
    ".env.example",
    ".python-version",
    "AI_USAGE.md",
    "alembic.ini",
    "data/samples/**",
    "docs/**",
    "migrations/**",
    "uv.lock",
]
