[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Online commands read DB_* through infrastructure.config.
# Settings automatically load .env from the working directory.
# Keep credentials out of this file. Offline SQL generation needs no connection.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
