substitutions:
  _IMAGE: europe-west3-docker.pkg.dev/ai-investigation-engine-512912/cloud-run-source-deploy/ai-investigation-engine

steps:
  # 1. Build the production Docker image
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - -t
      - '$_IMAGE:$COMMIT_SHA'
      - .

  # 2. Push the image to Artifact Registry
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '$_IMAGE:$COMMIT_SHA'

  # 3. Deploy to the existing Cloud Run service
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ai-investigation-engine
      - --region=europe-west3
      - --quiet
      - --container=placeholder-1
      - '--image=$_IMAGE:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY